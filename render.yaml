# ─────────────────────────────────────────────────────────────────────────────
# Fleet Command Transit Platform - Render Blueprint (Infrastructure as Code)
# ─────────────────────────────────────────────────────────────────────────────
# This file automatically provisions:
# 1. Managed PostgreSQL Database (PostGIS compatible)
# 2. Node.js Backend Web Service (REST API + WebSocket Telemetry Mesh)
# 3. React Frontend Static Site (Obsidian Dark Dashboard & Route Replay)
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: fleet-command-db
    databaseName: fleet_command
    user: fleet_admin
    plan: free
    region: oregon

services:
  # ── 1. Backend API & Real-Time WebSocket Web Service ────────────────────────
  - type: web
    name: fleet-command-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fleet-command-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: "*"

  # ── 2. Frontend React Dashboard (Vite Static Site) ──────────────────────────
  - type: web
    name: fleet-command-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fleet-command-api.onrender.com
